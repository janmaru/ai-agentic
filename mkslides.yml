slides:
  title: Agentic AI
  theme: white
  highlight_theme: github
  # Separatore con righe vuote intorno: il frontmatter YAML (---) nei blocchi di codice non spezza la slide
  separator: '\r?\n\r?\n---\r?\n\r?\n'

revealjs:
  history: true
  slideNumber: c/t
  hash: true
  transition: slide
  width: 1280
  height: 720
  mermaid:
    theme: base   # solo 'base' accetta themeVariables
    flowchart:
      padding: 24   # margine interno dei riquadri: evita etichette tagliate
    sequence:   # più basso = più grande una volta scalato nella slide
      mirrorActors: false
      messageMargin: 28
      actorMargin: 30
      actorFontSize: 22
      messageFontSize: 22
      noteFontSize: 22
    themeVariables:
      fontSize: 24px
      # Palette del deck (vedi slides/theme.css): famiglia del blu, accento arancio
      darkMode: false
      # Font di sistema: Mermaid misura le etichette prima che i web font siano caricati
      fontFamily: 'Arial, Helvetica, sans-serif'
      background: '#FFFFFF'
      primaryColor: '#F5F8FD'
      mainBkg: '#F5F8FD'
      primaryBorderColor: '#C2410C'
      nodeBorder: '#C2410C'
      primaryTextColor: '#1E3A8A'
      textColor: '#1E3A8A'
      secondaryColor: '#EEF3FA'
      tertiaryColor: '#EEF3FA'
      clusterBkg: '#EEF3FA'
      lineColor: '#475569'
      edgeLabelBackground: '#FFFFFF'
      actorBkg: '#F5F8FD'
      actorBorder: '#C2410C'
      actorTextColor: '#1E3A8A'
      actorLineColor: '#475569'
      signalColor: '#475569'
      signalTextColor: '#1E3A8A'
      labelBoxBkgColor: '#EEF3FA'
      labelBoxBorderColor: '#475569'
      labelTextColor: '#1E3A8A'
      loopTextColor: '#1E3A8A'
      noteBkgColor: '#EEF3FA'
      noteTextColor: '#1E3A8A'

plugins:
  - name: RevealMermaid
    extra_javascript:
      - https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@11.6.0/plugin/mermaid/mermaid.js
  - extra_css:
      - theme.css
  - name: LiveDemo   # finestre demo live (slides/live.js + demo/live_server.py)
    extra_javascript:
      - live.js
