slides:
  title: Agentic AI
  theme: black
  highlight_theme: monokai
  # Separatore con righe vuote intorno: il frontmatter YAML (---) nei blocchi di codice non spezza la slide
  separator: '\r?\n\r?\n---\r?\n\r?\n'

revealjs:
  history: true
  slideNumber: c/t
  hash: true
  transition: slide
  width: 1280
  height: 720
  mermaid:
    theme: base   # solo 'base' accetta themeVariables
    themeVariables:
      fontSize: 20px
      # Palette del deck (vedi slides/theme.css)
      darkMode: true
      background: '#191919'
      mainBkg: '#3c2a24'
      nodeBorder: '#d97757'
      clusterBkg: '#272822'
      actorBkg: '#3c2a24'
      actorBorder: '#d97757'
      actorTextColor: '#ffffff'
      actorLineColor: '#9aa0a6'
      signalColor: '#9aa0a6'
      signalTextColor: '#ffffff'
      labelBoxBkgColor: '#272822'
      labelBoxBorderColor: '#9aa0a6'
      labelTextColor: '#ffffff'
      loopTextColor: '#ffffff'
      noteBkgColor: '#272822'
      noteTextColor: '#ffffff'
      edgeLabelBackground: '#191919'
      primaryColor: '#3c2a24'
      primaryBorderColor: '#d97757'
      primaryTextColor: '#ffffff'
      secondaryColor: '#272822'
      tertiaryColor: '#272822'
      lineColor: '#9aa0a6'
      textColor: '#ffffff'

plugins:
  - name: RevealMermaid
    extra_javascript:
      - https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@11.6.0/plugin/mermaid/mermaid.js
  - extra_css:
      - theme.css
