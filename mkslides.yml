slides:
  title: Agentic AI
  theme: black
  highlight_theme: monokai
  # Separatore con righe vuote intorno: il frontmatter YAML (---) nei blocchi di codice non spezza la slide
  separator: '\r?\n\r?\n---\r?\n\r?\n'

revealjs:
  history: true
  slideNumber: c/t
  hash: true
  transition: slide
  width: 1280
  height: 720
  mermaid:
    theme: base   # solo 'base' accetta themeVariables
    themeVariables:
      fontSize: 20px
      # Palette del deck (vedi slides/theme.css)
      darkMode: true
      fontFamily: 'Manrope, system-ui, sans-serif'
      background: '#0F2A33'
      primaryColor: '#163944'
      mainBkg: '#163944'
      primaryBorderColor: '#d97757'
      nodeBorder: '#d97757'
      primaryTextColor: '#F4F7F8'
      textColor: '#F4F7F8'
      secondaryColor: '#0A1E25'
      tertiaryColor: '#0A1E25'
      clusterBkg: '#0A1E25'
      lineColor: '#93A6AA'
      edgeLabelBackground: '#0F2A33'
      actorBkg: '#163944'
      actorBorder: '#d97757'
      actorTextColor: '#F4F7F8'
      actorLineColor: '#93A6AA'
      signalColor: '#93A6AA'
      signalTextColor: '#F4F7F8'
      labelBoxBkgColor: '#0A1E25'
      labelBoxBorderColor: '#93A6AA'
      labelTextColor: '#F4F7F8'
      loopTextColor: '#F4F7F8'
      noteBkgColor: '#0A1E25'
      noteTextColor: '#F4F7F8'

plugins:
  - name: RevealMermaid
    extra_javascript:
      - https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@11.6.0/plugin/mermaid/mermaid.js
  - extra_css:
      - theme.css
